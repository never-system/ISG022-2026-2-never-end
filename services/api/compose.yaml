version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: never_dice_api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      # Variáveis da API
      NODE_ENV: ${NODE_ENV:-production}

      # Variáveis OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Variáveis S3
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}

      # Variáveis MQTT (se necessário)
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mqtt:1883}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC: ${MQTT_TOPIC:-never_dice/results}

    # Reiniciar automaticamente em caso de falha
    restart: unless-stopped

    # Definir limites de recursos (opcional)
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - never_dice_network

networks:
  never_dice_network:
    driver: bridge
