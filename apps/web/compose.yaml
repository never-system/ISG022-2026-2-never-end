services:
  neverdice:
    container_name: neverdice_web
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neverdice.entrypoints=websecure"
      - "traefik.http.routers.neverdice.rule=Host(`${APP_HOST:?Defina APP_HOST para publicar o NeverDice}`)"
      - "traefik.http.routers.neverdice.tls=true"
      - "traefik.http.services.neverdice.loadbalancer.server.port=80"
    networks:
      - traefik_proxy
    restart: unless-stopped

networks:
  traefik_proxy:
    external: true
