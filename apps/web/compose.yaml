services:
  neverdice:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neverdice.rule=Host(`${APP_HOST:?Defina APP_HOST para publicar o NeverDice}`)"
      - "traefik.http.services.neverdice.loadbalancer.server.port=80"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-proxy}"
